name: Actions Unit Tests

on:
  pull_request:
    paths:
      - "**/action.yml"
      - "**/src/run.js"
      - "**/src/run.test.js"
      - ".github/workflows/collect-prs-tests.yml"
  push:
    branches:
      - main
    paths:
      - "**/action.yml"
      - "**/src/run.js"
      - "**/src/run.test.js"
      - ".github/workflows/collect-prs-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.action_dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action_dir:
          - collect-prs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run action unit tests
        run: node --test "${{ matrix.action_dir }}/src/run.test.js"
