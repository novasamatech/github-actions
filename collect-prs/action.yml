name: "Collect Merged PRs"
description: "Collects merged pull requests either from the commit diff between two git refs, or by time window on a single branch"

inputs:
  github_token:
    description: "GitHub token for API access"
    required: true
  src_ref:
    description: "Source ref (branch name or commit SHA). If set together with dst_ref, collects PRs from commit diff between dst_ref and src_ref."
    required: false
    default: ""
  dst_ref:
    description: "Destination ref (branch name). Required. In diff mode (with src_ref), used as the base for commit comparison. In time mode (without src_ref), PRs merged into this branch are collected."
    required: true
  hours:
    description: "Time window in hours to look back for merged PRs (only used when src_ref is not set)"
    required: false
    default: "24"
  release_notes_format:
    description: "Release notes format: plain (default, main-compatible), plain-ext-v1, or CSV"
    required: false
    default: "plain"
  timezone:
    description: "IANA timezone used to format merge date for plain-ext-v1/csv (default: Europe/Berlin for CET/CEST)"
    required: false
    default: "Europe/Berlin"

outputs:
  should_build:
    description: "Whether there are merged PRs to build (true/false)"
    value: ${{ steps.collect.outputs.should_build }}
  release_notes:
    description: "Generated release notes from merged PRs"
    value: ${{ steps.collect.outputs.release_notes }}
  pr_count:
    description: "Number of merged PRs found"
    value: ${{ steps.collect.outputs.pr_count }}
  pr_numbers:
    description: "Comma-separated list of merged PR numbers"
    value: ${{ steps.collect.outputs.pr_numbers }}

runs:
  using: "composite"
  steps:
    - name: Collect merged PRs
      id: collect
      uses: actions/github-script@v7
      env:
        INPUT_SRC_REF: ${{ inputs.src_ref }}
        INPUT_DST_REF: ${{ inputs.dst_ref }}
        INPUT_HOURS: ${{ inputs.hours }}
        INPUT_RELEASE_NOTES_FORMAT: ${{ inputs.release_notes_format }}
        INPUT_TIMEZONE: ${{ inputs.timezone }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const path = require("path");
          const { execSync } = require("child_process");
          const actionPath = process.env.GITHUB_ACTION_PATH || process.cwd();
          const { runAction } = require(path.join(actionPath, "src", "run.js"));

          await runAction({
            github,
            context,
            core,
            execSync,
            env: process.env,
          });
