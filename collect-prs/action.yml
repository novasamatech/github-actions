name: "Collect Merged PRs"
description: "Collects merged pull requests either from the commit diff between two git refs, or by time window on a single branch"

inputs:
  github_token:
    description: "GitHub token for API access"
    required: true
  src_ref:
    description: "Source ref (branch name or commit SHA). If set together with dst_ref, collects PRs from commit diff between dst_ref and src_ref."
    required: false
    default: ""
  dst_ref:
    description: "Destination ref (branch name). Required. In diff mode (with src_ref), used as the base for commit comparison. In time mode (without src_ref), PRs merged into this branch are collected."
    required: true
  hours:
    description: "Time window in hours to look back for merged PRs (only used when src_ref is not set)"
    required: false
    default: "24"

outputs:
  should_build:
    description: "Whether there are merged PRs to build (true/false)"
    value: ${{ steps.collect.outputs.should_build }}
  release_notes:
    description: "Generated release notes from merged PRs"
    value: ${{ steps.collect.outputs.release_notes }}
  pr_count:
    description: "Number of merged PRs found"
    value: ${{ steps.collect.outputs.pr_count }}
  pr_numbers:
    description: "Comma-separated list of merged PR numbers"
    value: ${{ steps.collect.outputs.pr_numbers }}

runs:
  using: "composite"
  steps:
    - name: Collect merged PRs
      id: collect
      uses: actions/github-script@v7
      env:
        INPUT_SRC_REF: ${{ inputs.src_ref }}
        INPUT_DST_REF: ${{ inputs.dst_ref }}
        INPUT_HOURS: ${{ inputs.hours }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { execSync } = require('child_process');
          const { owner, repo } = context.repo;
          const srcRef = process.env.INPUT_SRC_REF;
          const dstRef = process.env.INPUT_DST_REF;
          const hours = parseInt(process.env.INPUT_HOURS, 10) || 24;

          const setEmpty = () => {
            core.setOutput("should_build", "false");
            core.setOutput("release_notes", "");
            core.setOutput("pr_count", "0");
            core.setOutput("pr_numbers", "");
          };

          const outputResults = (merged) => {
            core.setOutput("pr_count", merged.length.toString());
            core.setOutput("pr_numbers", merged.map(pr => pr.number).join(","));

            if (merged.length === 0) {
              core.warning("No merged pull requests found.");
              core.setOutput("should_build", "false");
              core.setOutput("release_notes", "");
              return;
            }

            const lines = ["Merged pull requests:"];
            for (const pr of merged) {
              lines.push(`- #${pr.number}: ${pr.title} ${pr.html_url}`);
            }
            const notes = lines.join("\n");

            core.notice(`Found ${merged.length} merged PR(s)`);
            core.info("Release notes:");
            core.info(notes);

            core.setOutput("should_build", "true");
            core.setOutput("release_notes", notes);
          };

          if (srcRef) {
            // --- Diff mode: collect PRs from commits between dst_ref and src_ref ---
            core.info(`Diff mode: collecting PRs from commits between origin/${dstRef} and ${srcRef}`);

            let sourceCommit;
            try {
              sourceCommit = execSync(`git rev-parse refs/remotes/origin/${srcRef}`).toString().trim();
              core.info(`Source ref origin/${srcRef} resolved to: ${sourceCommit}`);
            } catch {
              sourceCommit = execSync(`git rev-parse ${srcRef}`).toString().trim();
              core.info(`Source ref ${srcRef} resolved to commit: ${sourceCommit}`);
            }

            const commitsOutput = execSync(`git rev-list origin/${dstRef}..${sourceCommit} --reverse`).toString().trim();

            if (!commitsOutput) {
              core.info(`No commits found between origin/${dstRef} and source ref`);
              setEmpty();
              return;
            }

            const commits = commitsOutput.split('\n');
            core.info(`Found ${commits.length} commits to check`);

            const seenPrNumbers = new Set();
            const merged = [];

            for (const commitSha of commits) {
              core.info(`Checking commit: ${commitSha}`);

              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: commitSha,
              });

              for (const pr of prs.filter(pr => pr.merged_at !== null)) {
                if (!seenPrNumbers.has(pr.number)) {
                  seenPrNumbers.add(pr.number);
                  merged.push(pr);
                  core.info(`  Found PR #${pr.number}: ${pr.title}`);
                }
              }
            }

            outputResults(merged);

          } else {
            // --- Time mode: collect PRs merged into dst_ref branch in last N hours ---
            core.info(`Time mode: collecting PRs merged into '${dstRef}' in the last ${hours} hours`);

            const since = new Date(Date.now() - hours * 60 * 60 * 1000);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              base: dstRef,
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });

            core.info(`Total closed PRs fetched for branch '${dstRef}': ${prs.length}`);

            const merged = prs.filter(pr => pr.merged_at && new Date(pr.merged_at) >= since);
            core.info(`Merged PRs in last ${hours}h: ${merged.length}`);

            if (merged.length > 0) {
              merged.forEach(pr => {
                core.info(`  - #${pr.number}: ${pr.title} (merged: ${pr.merged_at})`);
              });
            }

            outputResults(merged);
          }
