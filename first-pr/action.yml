name: "Find First PR"
description: "Finds the first merged PR number in the commit range between two refs"

inputs:
  github_token:
    description: "GitHub token for API access"
    required: true
  src_ref:
    description: "Source ref (branch name or commit SHA) to start searching from"
    required: true
  dst_ref:
    description: "Destination ref (branch name) to compare against"
    required: true

outputs:
  pr_number:
    description: "The first merged PR number found, or empty string if none found"
    value: ${{ steps.find.outputs.pr_number }}

runs:
  using: "composite"
  steps:
    - name: Find first PR number
      id: find
      uses: actions/github-script@v7
      env:
        INPUT_SRC_REF: ${{ inputs.src_ref }}
        INPUT_DST_REF: ${{ inputs.dst_ref }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { execSync } = require('child_process');
          const srcRef = process.env.INPUT_SRC_REF;
          const dstRef = process.env.INPUT_DST_REF;

          // Resolve source ref to commit SHA
          let sourceCommit;
          try {
            sourceCommit = execSync(`git rev-parse refs/remotes/origin/${srcRef}`).toString().trim();
            console.log(`Source ref origin/${srcRef} resolved to: ${sourceCommit}`);
          } catch {
            sourceCommit = execSync(`git rev-parse ${srcRef}`).toString().trim();
            console.log(`Source ref ${srcRef} resolved to commit: ${sourceCommit}`);
          }

          // Get commits that are in source ref but not in destination ref (oldest first)
          const commitsOutput = execSync(`git rev-list origin/${dstRef}..${sourceCommit} --reverse`).toString().trim();

          if (!commitsOutput) {
            console.log(`No commits found between origin/${dstRef} and source ref`);
            core.setOutput('pr_number', '');
            return;
          }

          const commits = commitsOutput.split('\n');
          console.log(`Found ${commits.length} commits to check`);

          // Iterate through commits from first to last
          for (const commitSha of commits) {
            console.log(`Checking commit: ${commitSha}`);

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha
            });

            const mergedPrs = prs.filter(pr => pr.merged_at !== null);

            if (mergedPrs.length > 0) {
              const prNumber = mergedPrs[0].number;
              console.log(`Found source PR #${prNumber} for commit ${commitSha}`);
              core.setOutput('pr_number', prNumber);
              return;
            }
          }

          console.log('No merged PR found for any commit');
          core.setOutput('pr_number', '');
