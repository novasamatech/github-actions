name: Send Notification
description: >
  Send an arbitrary message to Telegram and/or Matrix via an external
  notification bot service.

inputs:
  message:
    description: 'Plain text message'
    required: true
  html_message:
    description: 'HTML-formatted message (optional, falls back to plain text for Matrix)'
    required: false
    default: ''
  bot_url:
    description: 'Notification bot base URL (e.g., https://bot.example.org)'
    required: true
  bot_api_token:
    description: 'API token for the notification bot service'
    required: true
  telegram_chat_ids:
    description: 'Comma-separated Telegram destinations: chat_id or chat_id:thread_id (optional, skipped if empty)'
    required: false
    default: ''
  matrix_room_ids:
    description: 'Comma-separated Matrix room IDs (optional, skipped if empty)'
    required: false
    default: ''
  retry_count:
    description: 'Number of retries after the initial attempt when the bot API call fails with a transport error, HTTP 429 or 5xx'
    required: false
    default: '6'
  retry_delay:
    description: 'Fallback delay in seconds between retry attempts when Retry-After is not provided'
    required: false
    default: '20'
  request_timeout:
    description: 'Per-attempt HTTP socket timeout in seconds'
    required: false
    default: '60'

runs:
  using: "composite"
  steps:
    - name: Send notifications
      shell: bash
      env:
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_HTML_MESSAGE: ${{ inputs.html_message }}
        INPUT_BOT_URL: ${{ inputs.bot_url }}
        INPUT_BOT_API_TOKEN: ${{ inputs.bot_api_token }}
        INPUT_TELEGRAM_CHAT_IDS: ${{ inputs.telegram_chat_ids }}
        INPUT_MATRIX_ROOM_IDS: ${{ inputs.matrix_room_ids }}
        INPUT_RETRY_COUNT: ${{ inputs.retry_count }}
        INPUT_RETRY_DELAY: ${{ inputs.retry_delay }}
        INPUT_REQUEST_TIMEOUT: ${{ inputs.request_timeout }}
      run: python3 "${{ github.action_path }}/send.py"
