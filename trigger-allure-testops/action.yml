name: Trigger Allure TestOps Test Plan

description: Trigger an Allure TestOps test plan run

inputs:
  testplan_id:
    description: 'Allure TestOps Test Plan ID'
    required: true
  launch_name:
    description: 'Launch name in Allure TestOps'
    required: false
    default: 'Test Run'
  allure_endpoint:
    description: 'Allure TestOps endpoint URL'
    required: false
    default: 'https://nova.testops.cloud'
  allure_token:
    description: 'Allure TestOps API token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Get JWT Token
      id: get-token
      shell: bash
      run: |
        echo "Getting JWT token from Allure TestOps..."

        RESPONSE=$(curl -s -X POST "${{ inputs.allure_endpoint }}/api/uaa/oauth/token" \
          --header "Accept: application/json" \
          --form "grant_type=apitoken" \
          --form "scope=openid" \
          --form "token=${{ inputs.allure_token }}")

        JWT_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

        if [ "$JWT_TOKEN" == "null" ] || [ -z "$JWT_TOKEN" ]; then
          echo "Failed to get JWT token"
          echo "$RESPONSE"
          exit 1
        fi

        echo "JWT token obtained successfully"
        echo "jwt_token=$JWT_TOKEN" >> $GITHUB_OUTPUT

    - name: Trigger Test Plan
      shell: bash
      run: |
        LAUNCH_NAME="${{ inputs.launch_name }}"

        echo "Triggering test plan ${{ inputs.testplan_id }}"
        echo "Launch name: $LAUNCH_NAME"

        RESPONSE=$(curl -s -X POST "${{ inputs.allure_endpoint }}/api/rs/testplan/${{ inputs.testplan_id }}/run" \
          --header "Accept: application/json" \
          --header "Content-Type: application/json" \
          --header "Authorization: Bearer ${{ steps.get-token.outputs.jwt_token }}" \
          --data "{\"launchName\": \"$LAUNCH_NAME\"}")

        echo "Response:"
        echo "$RESPONSE" | jq .

        # Test plan run endpoint may return either a single launch object or an array of launches.
        LAUNCH_IDS=$(echo "$RESPONSE" | jq -r 'if type=="array" then .[].id else .id end' 2>/dev/null)

        if [ -z "$LAUNCH_IDS" ] || echo "$LAUNCH_IDS" | grep -q "null"; then
          echo "❌ Failed to trigger test plan"
          exit 1
        fi

        echo ""
        echo "✅ Test plan triggered successfully!"
        for LAUNCH_ID in $LAUNCH_IDS; do
          echo "📊 Launch ID: $LAUNCH_ID"
          echo "🔗 Launch URL: ${{ inputs.allure_endpoint }}/launch/$LAUNCH_ID"
        done
